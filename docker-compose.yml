# Valheim dedicated server + login-gated manager WebUI.
#
#   docker compose up -d                  # nothing to copy, nothing to edit
#   docker compose logs manager           # copy the one-time setup URL it prints
#   open that URL                         # create the admin account, press Start
#
# There are no required configuration files. The manager boots unconfigured, writes
# a default ./settings/valheim.env, and prints a first-run setup URL; the wizard
# creates the admin account, generates the manager's own session secret, and stores
# both on the `valheim-manager-state` volume at mode 0600. `.env`, `manager.env` and
# a hand-written settings file are all optional overrides -- see manager/.env.example.
#
# Requires Docker Compose v2.30.0 or newer (`env_file` + `format: raw`).
#
# The `valheim` service sits behind the `server` profile on purpose: the manager
# owns the game container's lifecycle (pull / create / start / stop) so the UI can
# report each phase. `docker compose up -d` therefore brings up only the manager
# and its scoped Docker socket proxy.
name: valheim-manager

services:
  # ---------------------------------------------------------------- game server
  # Unmodified upstream image, configured only through its documented env vars and
  # volumes. Definition kept here as the canonical shape of the container the
  # manager creates; see README "Two ways to run the game container".
  valheim:
    image: ${VALHEIM_IMAGE:-ghcr.io/community-valheim-tools/valheim-server:latest}
    container_name: ${VALHEIM_CONTAINER_NAME:-valheim-server}
    profiles: ["server"]
    restart: ${VALHEIM_RESTART_POLICY:-unless-stopped}
    stop_grace_period: ${VALHEIM_STOP_TIMEOUT:-120}s
    cap_add:
      - sys_nice
    env_file:
      # The manager writes this file on its first boot, so on a clean tree it does
      # not exist yet -- `required: false` keeps `docker compose config` valid until
      # then. Only the `--profile server` escape hatch reads it; the manager passes
      # these values to the game container itself when it creates it.
      - path: ${VALHEIM_SETTINGS_DIR:-./settings}/valheim.env
        required: false
    ports:
      # Game port, Steam query port, and the crossplay backend port.
      - "${VALHEIM_PORTS:-2456-2458:2456-2458/udp}"
    volumes:
      - valheim-config:/config
      - valheim-data:/opt/valheim
    networks:
      - frontend
    logging:
      # The manager reads this log to detect readiness and to feed the console, and
      # Docker's default json-file driver has NO size limit -- a server left running
      # for months would otherwise grow one unbounded file on the host.
      driver: json-file
      options:
        max-size: ${VALHEIM_LOG_MAX_SIZE:-20m}
        max-file: "${VALHEIM_LOG_MAX_FILES:-5}"

  # ------------------------------------------------------------- permissions
  # Runs once on `docker compose up`, then exits. It exists because of a permission
  # problem neither of the long-running services can solve for itself:
  #
  #   The game server creates /config/worlds_local, and everything in it, as
  #   PUID:PGID with a default umask of 022 -- so mode 755 directories and 644
  #   files. The manager runs as its own uid in the game's GROUP, and `chmod`
  #   requires being the owner or holding CAP_FOWNER. The manager is neither: it is
  #   uid 10001 and runs with cap_drop: [ALL]. So it cannot grant itself access,
  #   and every upload and every delete failed with EACCES until somebody ran
  #   chmod on the host by hand.
  #
  # Root for a few milliseconds in a container with no network at all is a far
  # smaller thing to accept than either giving the network-facing manager
  # CAP_FOWNER or starting it as root and dropping privileges. PERMISSIONS_UMASK
  # in settings/valheim.env stops new files needing this at all; this is what
  # repairs the ones already on the volume.
  permissions:
    image: ${PERMISSIONS_IMAGE:-alpine:3.20}
    container_name: valheim-permissions
    user: "0:0"
    restart: "no"
    # Nothing to reach, so nothing to reach it. This is the only root container in
    # the stack and it should not be able to talk to anything.
    network_mode: "none"
    volumes:
      - valheim-config:/config
      # The settings directory too. Docker creates a missing bind-mount source as
      # root and the manager runs as uid 10001, which is why installing on native
      # Linux used to begin with `sudo chown -R 10001:10001 settings`.
      - ${VALHEIM_SETTINGS_DIR:-./settings}:/srv/settings
      # The game install, so the live BepInEx plugins folder can be prepared too.
      - valheim-data:/opt/valheim
    # `$$` is a literal `$` for the shell: Compose interpolates `$` in this file, so
    # an unescaped $dir would be substituted away to nothing before sh ever sees it.
    #
    # Every step is best-effort and the script always exits 0, on purpose. The
    # manager waits for this to COMPLETE, so a non-zero exit here would stop the
    # dashboard from starting at all -- turning "uploads are refused" into "nothing
    # runs". It says plainly what it did instead: `docker compose logs permissions`.
    command:
      - sh
      - -cu
      - |
        dir=/config/worlds_local
        gid='${MANAGER_GID:-1000}'
        uid='${MANAGER_UID:-10001}'
        # The directory the manager writes valheim.env into. Docker made it
        # root-owned; hand it to the uid the manager actually runs as.
        mkdir -p /srv/settings 2>/dev/null || true
        chown -R "$$uid:$$gid" /srv/settings 2>/dev/null || true
        chmod 775 /srv/settings 2>/dev/null || true
        # Backups, mods, and the folder the image expects staged plugins in. All
        # created here so a first backup or a first mod upload does not have to wait
        # for the game server to make them.
        for d in /config/backups /config/mods /config/bepinex /config/bepinex/plugins; do
          mkdir -p "$$d" 2>/dev/null || true
          chgrp "$$gid" "$$d" 2>/dev/null || true
          chmod 2775 "$$d" 2>/dev/null || true
        done
        # The live plugins folder, only if BepInEx is already installed: creating it
        # early could confuse the installer that owns that tree.
        live=/opt/valheim/bepinex/BepInEx/plugins
        if [ -d "$$live" ]; then
          chgrp -R "$$gid" "$$live" 2>/dev/null || true
          chmod -R g+rwX "$$live" 2>/dev/null || true
          chmod g+s "$$live" 2>/dev/null || true
        fi
        mkdir -p "$$dir" 2>/dev/null || true
        chgrp -R "$$gid" "$$dir" 2>/dev/null || true
        # setgid, so worlds the game creates from here on land in the shared group
        # without anything having to run again.
        chmod 2775 "$$dir" 2>/dev/null || true
        find "$$dir" -mindepth 1 -type d -exec chmod 2775 {} + 2>/dev/null || true
        find "$$dir" -mindepth 1 -type f -exec chmod 664 {} + 2>/dev/null || true
        owner=$$(stat -c %u /srv/settings 2>/dev/null || echo "?")
        if [ "$$owner" = "$$uid" ]; then
          echo "settings folder ready: owned by $$uid"
        else
          echo "WARNING: the settings folder is owned by $$owner, wanted $$uid."
          echo "WARNING: the manager may not be able to save your settings."
        fi
        mode=$$(stat -c %a "$$dir" 2>/dev/null || echo "?")
        if [ "$$mode" = "2775" ]; then
          echo "worlds folder ready: $$dir is $$mode, group $$gid"
        else
          echo "WARNING: $$dir is $$mode, wanted 2775 (group $$gid)."
          echo "WARNING: uploading and deleting worlds will be refused."
        fi
        exit 0

  # --------------------------------------------------------- scoped socket proxy
  # The ONLY service that touches /var/run/docker.sock. Everything not needed by
  # the manager is explicitly revoked, including the API sections that would allow
  # container escape (EXEC, BUILD, SWARM, SECRETS, ...).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: valheim-docker-socket-proxy
    restart: unless-stopped
    environment:
      # --- granted: exactly what the manager calls -------------------------
      CONTAINERS: 1        # inspect / create / remove / logs
      IMAGES: 1            # image inspect + pull on first run
      POST: 1              # allow write methods at all
      ALLOW_START: 1       # POST /containers/{id}/start
      ALLOW_STOP: 1        # POST /containers/{id}/stop
      ALLOW_RESTARTS: 1    # stop|restart|kill (force stop)
      # --- revoked (0 overrides this image's defaults where they differ) ---
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      GRPC: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      # PING and VERSION stay granted: the Docker SDK negotiates the API version
      # on connect and cannot work without them.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Internal-only: unreachable from the host and from the game container.
      - docker-proxy
    # This container holds the socket, so it is the one place a privilege escalation
    # would be worth most. haproxy here binds 2375, an unprivileged port, and needs
    # no capabilities at all.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ------------------------------------------------------------------- manager
  manager:
    build: ./manager
    image: valheim-manager:local
    container_name: valheim-manager
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_started
      # Not just ordering: the manager must not accept an upload into a directory
      # it cannot write, so it waits for the fixer to finish successfully.
      permissions:
        condition: service_completed_successfully
    # The uid/gid the manager runs as. The uid owns /srv/state (the credential volume)
    # and has to be able to write the mounted settings directory.
    #
    # The GROUP is the game server's, not the manager's own: uploaded worlds have to
    # end up writable by the game, which runs as PUID:PGID (1000) and saves to them
    # continuously, and the manager cannot chown what it writes -- `cap_drop: [ALL]`
    # removes CAP_CHOWN, and it is not root anyway. Sharing the group and writing
    # worlds group-writable is what lets both services write the same files while
    # keeping one uid each. Keep MANAGER_GID equal to PGID in settings/valheim.env.
    #
    # Change the uid only if a bind-mounted ./settings on a native Linux host belongs
    # to another one -- and then delete the valheim-manager-state volume first, since
    # it is initialised for 10001.
    user: "${MANAGER_UID:-10001}:${MANAGER_GID:-1000}"
    # Optional override, and the only reason this file is loaded with `format: raw`:
    # ADMIN_USER / ADMIN_PASSWORD_HASH / SESSION_SECRET set here skip first-run setup
    # entirely. Compose interpolates `$` in the compose file and in a default-format
    # env_file, which silently truncates every bcrypt (`$2b$12$...`) and argon2
    # (`$argon2id$v=19$...`) hash at the second `$`; raw format is the only loader
    # that passes the value through untouched (Compose v2.30.0+), and it keeps quotes
    # as part of the value, so values there must be bare. Do not re-add those three
    # keys to `environment:` below: it wins over env_file.
    # Leave the file absent and the setup wizard handles all three for you.
    env_file:
      - path: ${MANAGER_ENV_FILE:-./manager.env}
        format: raw
        required: false
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      VALHEIM_CONTAINER_NAME: ${VALHEIM_CONTAINER_NAME:-valheim-server}
      VALHEIM_IMAGE: ${VALHEIM_IMAGE:-ghcr.io/community-valheim-tools/valheim-server:latest}
      VALHEIM_NETWORK: valheim-mgr-frontend
      VALHEIM_CONFIG_VOLUME: valheim-config
      VALHEIM_DATA_VOLUME: valheim-data
      VALHEIM_RESTART_POLICY: ${VALHEIM_RESTART_POLICY:-unless-stopped}
      VALHEIM_STOP_TIMEOUT: ${VALHEIM_STOP_TIMEOUT:-120}
      # Paths *inside* the manager container. The settings directory is bind-mounted
      # from the host (VALHEIM_SETTINGS_DIR); the state file lives on a named volume.
      VALHEIM_ENV_FILE: /srv/settings/valheim.env
      MANAGER_STATE_FILE: /srv/state/manager-state.json
      # The worlds the Worlds panel lists, switches between and uploads into, on the
      # game's own config volume (mounted below). The game container sees the same
      # path; its mount is unchanged.
      VALHEIM_WORLDS_DIR: /config/worlds_local
      # Where a manual backup is written -- the same folder the game server keeps its
      # own hourly ones in, so there is one place to look.
      VALHEIM_BACKUPS_DIR: ${VALHEIM_BACKUPS_DIR:-/config/backups}
      # Mods, stored per world by the manager, and the two plugin folders they are
      # synced into before a container is created: the one the image copies from, and
      # the one the game actually loads.
      VALHEIM_MODS_DIR: ${VALHEIM_MODS_DIR:-/config/mods}
      VALHEIM_STAGING_PLUGINS_DIR: /config/bepinex/plugins
      VALHEIM_GAME_PLUGINS_DIR: /opt/valheim/bepinex/BepInEx/plugins
      MOD_UPLOAD_MAX_MB: ${MOD_UPLOAD_MAX_MB:-256}
      MOD_UPLOAD_MAX_FILES: ${MOD_UPLOAD_MAX_FILES:-2000}
      # Largest world one upload may carry, in whole megabytes. A long-played world
      # runs to a few hundred MB of chunks; past this the upload is refused before
      # anything is written.
      WORLD_UPLOAD_MAX_MB: ${WORLD_UPLOAD_MAX_MB:-1024}
      # ...and how many files one upload may carry. A 1.0 world is one file per visited
      # map chunk, so a dropped folder is routinely thousands of them -- far past the
      # 1000 a multipart parser allows by default. A .zip is one file whatever the
      # world's size, which is the way round this for a very large world.
      WORLD_UPLOAD_MAX_FILES: ${WORLD_UPLOAD_MAX_FILES:-5000}
      # Only used to print a ready-to-click first-run setup URL, e.g.
      # http://valheim.lan:8080 -- the manager never calls itself.
      MANAGER_URL: ${MANAGER_URL:-}
      READY_LOG_PATTERN: ${READY_LOG_PATTERN:-}
      LOG_TAIL_LINES: ${LOG_TAIL_LINES:-200}
      LOG_POLL_SECONDS: ${LOG_POLL_SECONDS:-1.0}
      STATUS_EVERY_N_POLLS: ${STATUS_EVERY_N_POLLS:-2}
      # There is deliberately no TZ here. The dashboard's clock takes the host's zone
      # from the /etc/localtime mount below, so it is right with nothing to configure.
      #
      # It must be ABSENT rather than empty: glibc reads an empty TZ as UTC, so
      # `TZ: ${TZ:-}` would quietly override the mount with the very default it was
      # meant to replace. To pin a zone by hand instead, add `TZ: Asia/Jerusalem`
      # here -- an explicit value wins over the mount.
    ports:
      # 0.0.0.0 publishes on EVERY interface the host has. Behind home NAT that
      # means the LAN only; on a VPS or any host with a routable address it is
      # public immediately, and this login has no rate limiting. Set
      # MANAGER_BIND=127.0.0.1 there and tunnel in. See README "Security notes".
      - "${MANAGER_BIND:-0.0.0.0}:${MANAGER_PORT:-8080}:8080"
    volumes:
      # The settings *directory*, read-write. A directory rather than a single file
      # on purpose: Docker turns a missing bind-mount source into a directory, and a
      # settings *file* that became a directory was a trap worth retiring. The
      # manager creates valheim.env inside it on first boot and never overwrites one
      # that already exists.
      - ${VALHEIM_SETTINGS_DIR:-./settings}:/srv/settings
      # The host's own time zone, read-only, so the dashboard's clock reads the wall
      # clock of the machine the stack runs on without anyone setting TZ. This one
      # file is all glibc needs -- it carries the offset AND the abbreviation the
      # clock labels itself with, so /etc/timezone is not mounted as well: it is
      # Debian-specific, and a bind mount whose source is missing becomes a
      # directory, which is worse than not having it.
      - /etc/localtime:/etc/localtime:ro
      # The manager's own credentials (admin user, password hash, session secret) at
      # mode 0600. A named volume, not a bind mount: nothing else should read it, and
      # it is initialised with the image's ownership so it is writable out of the box.
      - valheim-manager-state:/srv/state
      # The GAME's config volume, read-write, for /config/worlds_local -- the worlds
      # the Worlds panel lists, switches between and uploads into. The game container
      # mounts the same volume at the same path and its mount is unchanged; this one
      # is what lets the manager see the worlds at all. The worlds directory itself
      # belongs to the game server: the manager creates it only if /config lets it,
      # and otherwise says so and points at pressing Start once. It only ever ADDS
      # worlds, and never deletes one.
      - valheim-config:/config
      # The game install, for /opt/valheim/bepinex/BepInEx/plugins. The image copies
      # staged plugins in with `rsync -a` and no `--delete`, so a mod removed from
      # staging stays in the install -- and the install outlives the container. The
      # manager writes that folder itself, or per-world mods would not survive a
      # switch. It only ever removes what it placed there.
      - valheim-data:/opt/valheim
    networks:
      - frontend
      - docker-proxy
    # Nothing here needs a capability: it binds 8080 and talks HTTP to the proxy. The
    # first-boot admin-creation path and create-container rights through the proxy are
    # exactly why this service should be able to gain nothing beyond them.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # /healthz answers while the manager is still awaiting first-run setup -- a
      # manager with no admin yet is running correctly, and saying otherwise would be
      # a lie that shows as `(unhealthy)` in `docker ps`, holds up anything gated on
      # `depends_on: condition: service_healthy`, and sends the operator hunting a
      # fault instead of reading the setup URL. (Nothing restarts on health alone:
      # Engine and Compose act on process exit, not health status.)
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  frontend:
    name: valheim-mgr-frontend
  docker-proxy:
    name: valheim-mgr-docker-proxy
    internal: true

volumes:
  valheim-config:
    name: valheim-config
  valheim-data:
    name: valheim-data
  valheim-manager-state:
    name: valheim-manager-state

# ---------------------------------------------------------------- CasaOS metadata
# CasaOS reads this extension field when it imports a compose file, and it is what
# gives the app a name, an icon and a working "open" button in the CasaOS dashboard
# instead of a generic placeholder. Docker Compose itself ignores `x-` keys, so this
# block changes nothing about how the stack runs.
#
# `icon` has to be a URL CasaOS can fetch, which is why it points at the copy in the
# repo rather than at /static on the manager itself: the dashboard has to be able to
# draw the tile while the manager is stopped.
x-casaos:
  architectures:
    # The upstream Valheim dedicated server is x86-64 only, so the stack as a whole
    # is, even though the manager image itself would build anywhere.
    - amd64
  main: manager
  author: YakovShtef
  developer: YakovShtef
  category: Games
  icon: https://raw.githubusercontent.com/YakovShtef/valheim-manager/main/manager/app/static/icon.png
  scheme: http
  # Interpolated like the rest of the file, so it follows MANAGER_PORT in `.env`
  # rather than drifting from the port the manager is actually published on.
  port_map: "${MANAGER_PORT:-8080}"
  title:
    en_us: Valheim Server Manager
  tagline:
    en_us: Run a Valheim dedicated server from your browser.
  description:
    en_us: >-
      Start, stop and restart a Valheim dedicated server and watch its log live.
      Edit the server settings and Valheim's world modifiers, switch between worlds,
      upload and back them up, and manage per-world mods -- all behind a login, with
      no file editing and no shell.
