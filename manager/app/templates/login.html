{% extends "base.html" %}
{% block title %}Sign in &middot; Valheim Server Manager{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Valheim Server Manager</h1>
  <p class="muted">Sign in to view server status and logs.</p>
  {% if error %}<p class="banner banner-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="off">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
